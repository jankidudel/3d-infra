name: deploy-all

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and AWS stage to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      processor_ref:
        description: 3d-processor branch, tag, or commit
        required: true
        default: main
      api_ref:
        description: 3d-api branch, tag, or commit
        required: true
        default: main
      frontend_ref:
        description: 3d-frontend branch, tag, or commit
        required: true
        default: main

permissions:
  contents: read
  id-token: write

concurrency:
  group: infrastructure-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      AWS_REGION: us-east-1
      STAGE: ${{ inputs.environment || 'dev' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      BUDGET_ALERT_EMAIL: ${{ vars.BUDGET_ALERT_EMAIL }}
      OPERATIONS_ALERT_EMAIL: ${{ vars.OPERATIONS_ALERT_EMAIL }}
      MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
    steps:
      - name: Check out infrastructure
        uses: actions/checkout@v6
        with:
          path: 3d-infra

      - name: Verify component repository access token
        env:
          COMPONENT_REPOSITORIES_TOKEN: ${{ secrets.COMPONENT_REPOSITORIES_TOKEN }}
        run: |
          if [ -z "$COMPONENT_REPOSITORIES_TOKEN" ]; then
            echo "::error::COMPONENT_REPOSITORIES_TOKEN is not available. Add it as a 3d-infra repository secret or to the selected GitHub Environment."
            exit 1
          fi

      - name: Verify AWS deployment configuration
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is not available. Add it as a variable in the selected GitHub Environment."
            exit 1
          fi
          if ! printf '%s' "$AWS_DEPLOY_ROLE_ARN" | grep -Eq '^arn:aws:iam::[0-9]{12}:role/.+'; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is not a valid IAM role ARN."
            exit 1
          fi
          if ! printf '%s' "$AWS_ACCOUNT_ID" | grep -Eq '^[0-9]{12}$'; then
            echo "::error::AWS_ACCOUNT_ID must be the 12-digit target AWS account ID."
            exit 1
          fi
          if [ "$STAGE" = "prod" ] && [ -z "$GOOGLE_SITE_VERIFICATION" ]; then
            echo "::error::GOOGLE_SITE_VERIFICATION is not available. Add it as a variable in the prod GitHub Environment."
            exit 1
          fi

      - name: Check out processor
        uses: actions/checkout@v6
        with:
          repository: jankidudel/3d-processor
          ref: ${{ inputs.processor_ref || 'main' }}
          path: 3d-processor
          token: ${{ secrets.COMPONENT_REPOSITORIES_TOKEN }}

      - name: Check out API
        uses: actions/checkout@v6
        with:
          repository: jankidudel/3d-api
          ref: ${{ inputs.api_ref || 'main' }}
          path: 3d-api
          token: ${{ secrets.COMPONENT_REPOSITORIES_TOKEN }}

      - name: Check out frontend
        uses: actions/checkout@v6
        with:
          repository: jankidudel/3d-frontend
          ref: ${{ inputs.frontend_ref || 'main' }}
          path: 3d-frontend
          token: ${{ secrets.COMPONENT_REPOSITORIES_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            3d-infra/package-lock.json
            3d-frontend/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: 3d-api/go.mod
          cache-dependency-path: 3d-api/go.sum

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install infrastructure dependencies
        working-directory: 3d-infra
        run: npm ci

      - name: Install frontend dependencies
        working-directory: 3d-frontend
        run: npm ci

      - name: Install Lambda packaging tool
        run: dotnet tool install --global Amazon.Lambda.Tools --version 7.0.0

      - name: Verify infrastructure
        working-directory: 3d-infra
        run: npm run precommit

      - name: Verify processor
        working-directory: 3d-processor
        run: dotnet test 3d-processor.slnx --nologo

      - name: Verify API
        working-directory: 3d-api
        run: make check

      - name: Verify frontend
        working-directory: 3d-frontend
        run: npm run verify

      - name: Build deployment artifacts
        working-directory: 3d-infra
        run: make application-artifacts

      - name: Show non-secret OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const encodedPayload = token.split('.')[1];
            const claims = JSON.parse(Buffer.from(encodedPayload, 'base64url').toString('utf8'));
            core.info(JSON.stringify({
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub,
              repository: claims.repository,
              environment: claims.environment,
            }, null, 2));

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          retry-max-attempts: 3

      - name: Show CloudFormation changes
        working-directory: 3d-infra
        run: |
          PROCESSOR_ARTIFACT_PATH="$GITHUB_WORKSPACE/3d-processor/artifacts/3d-processor.zip" \
          API_ARTIFACT_PATH="$GITHUB_WORKSPACE/3d-api/artifacts/3d-api.zip" \
          FRONTEND_ARTIFACT_PATH="$GITHUB_WORKSPACE/3d-frontend/dist/3d-frontend/browser" \
          npx cdk diff -c stage="$STAGE"

      - name: Deploy with CDK
        env:
          RATE_LIMIT_SECRET: ${{ secrets.RATE_LIMIT_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          DEV_BASIC_AUTHORIZATION: ${{ secrets.DEV_BASIC_AUTHORIZATION }}
        working-directory: 3d-infra
        run: |
          if [ -z "$RATE_LIMIT_SECRET" ]; then
            echo "::error::RATE_LIMIT_SECRET is not configured in the selected GitHub Environment."
            exit 1
          fi
          if [ "$STAGE" = "prod" ] && [ -z "$TURNSTILE_SECRET" ]; then
            echo "::error::TURNSTILE_SECRET is not configured in the prod GitHub Environment."
            exit 1
          fi
          if [ "$STAGE" = "dev" ] && [ -z "$DEV_BASIC_AUTHORIZATION" ]; then
            echo "::error::DEV_BASIC_AUTHORIZATION is not configured in the dev GitHub Environment."
            exit 1
          fi
          PARAMETERS=(--parameters "RateLimitSecret=$RATE_LIMIT_SECRET")
          if [ "$STAGE" = "prod" ]; then
            PARAMETERS+=(--parameters "TurnstileSecret=$TURNSTILE_SECRET")
          fi
          if [ "$STAGE" = "dev" ]; then
            PARAMETERS+=(--parameters "DevBasicAuthAuthorization=$DEV_BASIC_AUTHORIZATION")
          fi
          PROCESSOR_ARTIFACT_PATH="$GITHUB_WORKSPACE/3d-processor/artifacts/3d-processor.zip" \
          API_ARTIFACT_PATH="$GITHUB_WORKSPACE/3d-api/artifacts/3d-api.zip" \
          FRONTEND_ARTIFACT_PATH="$GITHUB_WORKSPACE/3d-frontend/dist/3d-frontend/browser" \
          npx cdk deploy -c stage="$STAGE" --require-approval never \
          "${PARAMETERS[@]}" --outputs-file cdk-outputs.json

      - name: Report production DNS and deployment details
        if: ${{ inputs.environment == 'prod' }}
        working-directory: 3d-infra
        run: |
          echo "Production canonical URL: https://www.inspectmesh.com"
          echo "Route 53 hosted-zone nameservers must be delegated at the domain registrar before ACM validation can complete."
          echo "CloudFormation outputs:"
          cat cdk-outputs.json
