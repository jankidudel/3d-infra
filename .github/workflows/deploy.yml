name: deploy-all

on:
  workflow_dispatch:
    inputs:
      # Hosted development is disabled. For future re-enablement, restore this
      # selector and wire job environment, STAGE and concurrency to its value.
      # environment:
      #   description: GitHub Environment and AWS stage to deploy
      #   required: true
      #   default: prod
      #   type: choice
      #   options:
      #     - prod
      #     - dev
      processor_ref:
        description: 3d-processor branch, tag, or commit
        required: true
        default: main
      api_ref:
        description: 3d-api branch, tag, or commit
        required: true
        default: main
      frontend_ref:
        description: 3d-frontend branch, tag, or commit
        required: true
        default: main

permissions:
  contents: read
  id-token: write

concurrency:
  # Never overlap or interrupt production infrastructure updates.
  group: infrastructure
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: Deploy prod
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    env:
      AWS_REGION: us-east-1
      STAGE: prod
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      BUDGET_ALERT_EMAIL: ${{ vars.BUDGET_ALERT_EMAIL }}
      OPERATIONS_ALERT_EMAIL: ${{ vars.OPERATIONS_ALERT_EMAIL }}
      MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - name: Report runner startup
        run: |
          echo "Deployment runner started at $(date -u +%FT%TZ) for $GITHUB_SHA."
          echo "Runner: $RUNNER_OS / $RUNNER_ARCH. Application checks run before AWS deployment."
          echo "Runner started at $(date -u +%FT%TZ)." >> "$GITHUB_STEP_SUMMARY"

      - name: Check out infrastructure
        uses: actions/checkout@v6
        with:
          path: 3d-infra

      - name: Verify component repository access token
        env:
          COMPONENT_REPOSITORIES_TOKEN: ${{ secrets.COMPONENT_REPOSITORIES_TOKEN }}
        run: |
          if [ -z "$COMPONENT_REPOSITORIES_TOKEN" ]; then
            echo "::error::COMPONENT_REPOSITORIES_TOKEN is not available. Add it as a 3d-infra repository secret or to the selected GitHub Environment."
            exit 1
          fi

      - name: Verify AWS deployment configuration
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is not available. Add it as a variable in the selected GitHub Environment."
            exit 1
          fi
          if ! printf '%s' "$AWS_DEPLOY_ROLE_ARN" | grep -Eq '^arn:aws:iam::[0-9]{12}:role/.+'; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is not a valid IAM role ARN."
            exit 1
          fi
          if ! printf '%s' "$AWS_ACCOUNT_ID" | grep -Eq '^[0-9]{12}$'; then
            echo "::error::AWS_ACCOUNT_ID must be the 12-digit target AWS account ID."
            exit 1
          fi
          if [ "$STAGE" = "prod" ] && [ -z "$GOOGLE_SITE_VERIFICATION" ]; then
            echo "::error::GOOGLE_SITE_VERIFICATION is not available. Add it as a variable in the prod GitHub Environment."
            exit 1
          fi

      - name: Check out processor
        uses: actions/checkout@v6
        with:
          repository: jankidudel/3d-processor
          ref: ${{ inputs.processor_ref || 'main' }}
          path: 3d-processor
          token: ${{ secrets.COMPONENT_REPOSITORIES_TOKEN }}

      - name: Check out API
        uses: actions/checkout@v6
        with:
          repository: jankidudel/3d-api
          ref: ${{ inputs.api_ref || 'main' }}
          path: 3d-api
          token: ${{ secrets.COMPONENT_REPOSITORIES_TOKEN }}

      - name: Check out frontend
        uses: actions/checkout@v6
        with:
          repository: jankidudel/3d-frontend
          ref: ${{ inputs.frontend_ref || 'main' }}
          path: 3d-frontend
          token: ${{ secrets.COMPONENT_REPOSITORIES_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            3d-infra/package-lock.json
            3d-frontend/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: 3d-api/go.mod
          cache-dependency-path: 3d-api/go.sum

      - uses: actions/setup-dotnet@v5
        with:
          # Pin a published SDK; the channel alias selected an unavailable archive.
          dotnet-version: 10.0.402

      - name: Install infrastructure dependencies
        working-directory: 3d-infra
        run: npm ci

      - name: Install frontend dependencies
        working-directory: 3d-frontend
        run: npm ci

      - name: Configure the production contact CAPTCHA
        working-directory: 3d-frontend
        run: node --experimental-strip-types scripts/configure-contact-captcha.mts

      - name: Install Lambda packaging tool
        run: dotnet tool install --global Amazon.Lambda.Tools --version 7.0.0

      - name: Verify infrastructure
        working-directory: 3d-infra
        run: npm run precommit

      - name: Verify processor
        working-directory: 3d-processor
        run: dotnet test 3d-processor.slnx --nologo

      - name: Install Chrome Headless Shell for the render audit
        working-directory: 3d-frontend
        timeout-minutes: 5
        run: bash .github/scripts/install-audit-browser.sh

      # API package depends on its checks. Do not run make check a second time.
      - name: Verify API and package backend artifacts
        working-directory: 3d-infra
        run: make backend-artifacts

      - name: Generate frontend content once
        working-directory: 3d-frontend
        run: npm run verify:prepare

      - name: Check frontend source
        working-directory: 3d-frontend
        run: npm run verify:source

      - name: Test frontend
        working-directory: 3d-frontend
        timeout-minutes: 15
        run: npm run verify:tests

      - name: Build and audit frontend HTML
        working-directory: 3d-frontend
        timeout-minutes: 10
        run: npm run verify:build

      - name: Audit rendered frontend pages
        working-directory: 3d-frontend
        timeout-minutes: 15
        run: npm run seo:render

      - name: Seal verified frontend artifact
        working-directory: 3d-frontend
        run: npm run seo:artifact:seal

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          retry-max-attempts: 3

      - name: Recheck the exact frontend release artifact
        working-directory: 3d-frontend
        run: npm run seo:artifact

      - name: Synthesize deployment once
        working-directory: 3d-infra
        run: |
          PROCESSOR_ARTIFACT_PATH="$GITHUB_WORKSPACE/3d-processor/artifacts/3d-processor.zip" \
          API_ARTIFACT_PATH="$GITHUB_WORKSPACE/3d-api/artifacts/3d-api.zip" \
          FRONTEND_ARTIFACT_PATH="$GITHUB_WORKSPACE/3d-frontend/dist/3d-frontend/browser" \
          npx cdk synth --app "node dist/bin/3d-infra.js" -c stage="$STAGE" --quiet

      - name: Show CloudFormation changes
        working-directory: 3d-infra
        # Template diff only; exact replacement decisions are made by the deployment change set.
        run: npx cdk diff --app cdk.out --change-set=false

      - name: Deploy with CDK
        env:
          RATE_LIMIT_SECRET: ${{ secrets.RATE_LIMIT_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        working-directory: 3d-infra
        run: |
          if [ -z "$RATE_LIMIT_SECRET" ]; then
            echo "::error::RATE_LIMIT_SECRET is not configured in the selected GitHub Environment."
            exit 1
          fi
          if [ "$STAGE" = "prod" ] && [ -z "$TURNSTILE_SECRET" ]; then
            echo "::error::TURNSTILE_SECRET is not configured in the prod GitHub Environment."
            exit 1
          fi
          PARAMETERS=(--parameters "RateLimitSecret=$RATE_LIMIT_SECRET")
          if [ "$STAGE" = "prod" ]; then
            PARAMETERS+=(--parameters "TurnstileSecret=$TURNSTILE_SECRET")
          fi
          node dist/bin/deploy-with-progress.js --app cdk.out --require-approval never \
          "${PARAMETERS[@]}" --outputs-file cdk-outputs.json

      - name: Report production DNS and deployment details
        working-directory: 3d-infra
        run: |
          echo "Production canonical URL: https://www.inspectmesh.com"
          echo "Route 53 hosted-zone nameservers must be delegated at the domain registrar before ACM validation can complete."
          echo "CloudFormation outputs:"
          cat cdk-outputs.json

      - name: Remove retired tool documents
        working-directory: 3d-frontend
        run: |
          FRONTEND_BUCKET="$(aws cloudformation describe-stacks --stack-name "three-d-infra-$STAGE" --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)"
          node --experimental-strip-types scripts/retire-tool-documents.mts dist/3d-frontend/browser "$FRONTEND_BUCKET"

      - name: Verify production frontend delivery
        working-directory: 3d-frontend
        run: npm run seo:live

      - name: Preserve SEO audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: technical-seo-prod
          path: 3d-frontend/tmp/seo

      - name: Report deployment result
        if: always()
        env:
          DEPLOY_RESULT: ${{ job.status }}
        run: |
          {
            echo "### Production deployment: $DEPLOY_RESULT"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Frontend source, tests, HTML, browser rendering and artifact sealing appear as separate steps."
            echo "If live logs stop updating, refresh the page or use the job menu to view raw logs."
          } >> "$GITHUB_STEP_SUMMARY"
